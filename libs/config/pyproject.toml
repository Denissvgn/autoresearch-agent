[tool.poetry]
name = "traid-config"
version = "0.1.0"
description = "Shared Vault-backed configuration loader for TRAID Platform microservices"
authors = ["Traid Platform Team"]
packages = [{ include = "config" }]

[tool.poetry.dependencies]
python = "^3.11"
hvac = "^2.0.0"
python-dotenv = "^1.0.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "T20", "Q"]
ignore = ["S101", "S311"]  # Allow assert statements and random module usage

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
