 [tool.poetry]
 name = "resilience"
 version = "0.1.0"
 description = "Resilience utilities: async backoff, circuit breaker, timeouts, and wrappers"
 authors = ["Traid Platform Team"]
 packages = [{ include = "resilience" }]

 [tool.poetry.dependencies]
 python = "^3.12"

 [tool.poetry.group.dev.dependencies]
 pytest = "^8.0.0"
 pytest-asyncio = "^0.23.0"
 pytest-cov = "^4.1.0"
 black = "^24.2.0"
 isort = "^5.13.2"
 mypy = "^1.8.0"

 [build-system]
 requires = ["poetry-core"]
 build-backend = "poetry.core.masonry.api"

 [tool.black]
 line-length = 100
 target-version = ['py312']

 [tool.isort]
 profile = "black"
 multi_line_output = 3
 line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests", "resilience"]
addopts = "--cov=resilience --cov-report=term-missing --cov-fail-under=90"
asyncio_mode = "auto"