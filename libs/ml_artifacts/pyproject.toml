[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-artifacts"
version = "0.1.0"
description = "Shared ML artifact runtime helpers for Traid training and inference services"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.0",
    "pandas>=2.3.0",
    "scikit-learn>=1.8.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.8.0"]
tsfm = ["pyarrow>=15.0.0"]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ml_artifacts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
