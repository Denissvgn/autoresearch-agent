[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "observability"
version = "0.1.0"
description = "Shared OpenTelemetry observability library for TRAID Platform microservices"
requires-python = ">=3.12"
authors = [{name = "Traid Platform Team"}]
dependencies = [
    "opentelemetry-sdk>=1.21.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.21.0,<2.0.0",
    "opentelemetry-instrumentation-httpx>=0.47b0,<1.0.0",
    "opentelemetry-instrumentation-psycopg2>=0.47b0,<1.0.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.47b0,<1.0.0",
    "prometheus-client>=0.19.0,<1.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0,<8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "httpx>=0.25.0,<1.0.0",
]

[tool.setuptools]
packages = [
    "observability",
    "libs.observability",
]

[tool.setuptools.package-dir]
observability = "observability"
"libs.observability" = "."

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "T20", "Q"]
ignore = ["S101", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
