version: 1
gate_bundle_id: production_trading_model_promotion_v1
created_at: "2026-04-30"
scope: production
backlog: docs/ml/autoresearch_production_trading_models_backlog.md
development_gate_bundle: reports/direction-tuning/promotion/development_gate_bundle_v1.yaml

promotion_policy:
  allowed_scopes:
    - development
    - paper
    - canary
    - production
  manual_or_signed_approval_required:
    paper: true
    canary: true
    production: true
  direct_development_to_production_allowed: false
  full_decision_chain_required: true
  required_prior_scopes:
    production:
      - development
      - paper
      - canary
  required_rollback_target: true

gate_tiers:
  lineage:
    required: true
    checks:
      development_promotion_record_required: true
      paper_promotion_record_required_for_production: true
      canary_promotion_record_required_for_production: true

  approval:
    required: true
    checks:
      manual_or_signed_approval_required: true
      approver_identity_required: true

  production_readiness:
    required: true
    checks:
      model_card_required: true
      supervised_feature_readiness_required: true
      inference_parity_reload_required: true
      rollback_target_required: true

  rl_readiness:
    required_for_rl: true
    checks:
      rl_oos_provenance_required: true
      rl_economic_replay_required: true

  # MQ-B5: PnL-first promotion — at PRODUCTION scope the post-cost-vs-baseline
  # economic gate is FIRST-CLASS, UNCONDITIONAL, and UNWAIVABLE (enforced in
  # development_gate_bundle.py by scope, independent of this flag; the flag is
  # declared here for self-documentation). A config that improves composite or
  # AUC but worsens honest post-cost PnL vs baseline cannot promote to
  # production. Development scope retains its flag + waiver escape hatch.
  economic_replay:
    required: true
    checks:
      worsening_vs_baseline_blocks_promotion: true
      unconditional_at_production_scope: true
      post_cost_metrics_required: true
      replay_assumptions_required: true
      profit_score_required: true
      replay_artifact_hash_required: true

  paper_validation:
    required_for_canary: true
    required_for_production: true
    checks:
      paper_validation_pass_required: true

  canary_validation:
    required_for_production: true
    checks:
      canary_duration_pass_required: true
      min_duration_hours: 24

  live_controls:
    required: true
    checks:
      live_risk_limits_required: true
      monitoring_alerts_configured_required: true
      blocking_alerts_forbid_production: true
      # Relocated from the development signal_health_monitoring tier: these
      # require live-serving telemetry (a drift reference window and serving
      # operational counters) that only exists once the model is serving, so
      # they are enforced here at production/canary scope rather than at
      # development promotion.
      signal_health_drift_metrics_required: true
      signal_health_operational_metrics_required: true

promotion_blockers:
  - missing_development_promotion
  - missing_paper_promotion
  - missing_canary_promotion
  - missing_production_approval
  - missing_rollback_target
  - missing_model_card
  - missing_feature_readiness
  - inference_reload_failed
  - missing_paper_validation
  - missing_canary_duration
  - missing_live_risk_limits
  - missing_monitoring_alerts
  - missing_rl_oos_provenance
  - missing_rl_economic_replay

status:
  definition_complete: true
  code_integration_complete: true
  notes:
    - ARP-012 introduces paper, canary, and production promotion scopes on top of the development promotion gate.
    - Production promotion requires the recorded development, paper, and canary decision chain plus live readiness evidence.
