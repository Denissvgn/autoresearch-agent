version: 1
gate_bundle_id: development_direction_prediction_v1
created_at: "2026-04-25"
scope: development
backlog: docs/ml/plan-productionDirectionPredictionUpgrade.prompt.md
matrix: reports/direction-tuning/experiment_matrix_v1.yaml

promotion_policy:
  auc_only_promotion_allowed: false
  live_production_promotion_allowed: false
  live_canary_duration_required: false
  required_decision_record: true
  required_rollback_target: true

gate_tiers:
  baseline_inventory:
    required: true
    checks:
      primary_pilot_represented:
        instrument: DOGE_USDT
        timeframe: 15m
        required: true
      generalization_target_represented:
        instrument: BTC_USDT
        timeframe: 15m
        required: true
        missing_allowed_for_non_promotion_sweeps: true

  direction_quality:
    required: true
    checks:
      min_direction_auc: 0.55
      min_auc_ci_lower: 0.53
      min_walkforward_mean_auc: 0.53
      max_walkforward_auc_cv: 0.20
      min_active_base_learners_after_pruning: 5
      max_signal_rate: 0.35
      # PR-9 Layer 8: separate, looser cap for the per-FOLD signal-rate
      # distribution (walk-forward variance), as the DM-3 distribution check
      # intends. Without it the check falls back to max_signal_rate*1.2 (0.42)
      # and over-rotates on natural fold variance — e.g. served operating rate
      # 0.348 PASSES the 0.35 cap but fold-3 hits 0.543 and trips a phantom
      # signal_saturation. The served operating rate (max_signal_rate) remains
      # the hard gate; this guards only against per-fold instability. Direction
      # is an RL feature, so a higher per-fold signal rate is acceptable.
      max_signal_rate_distribution: 0.6

  calibration:
    required: true
    checks:
      max_ece_calibrated: 0.05
      brier_score_required: true
      reliability_diagram_required: true
      threshold_stability_by_fold_required: true
      max_threshold_cv: 0.20
      signal_rate_distribution_required: true
      per_regime_calibration_required_when_labels_exist: true

  probabilistic_forecast:
    required_for_tsfm_candidates: true
    checks:
      pinball_loss_required_for_quantiles: true
      quantile_coverage_required_for_quantiles: true
      interval_sharpness_required_for_quantiles: true
      crps_approximation_required_for_quantiles_or_samples: true

  economic_replay:
    required: true
    required_for_rl_finalists: true
    checks:
      post_cost_metrics_required: true
      replay_artifact_hash_required: true
      replay_assumptions_required: true
      profit_score_required: true
      min_positive_folds: 4
      # DM-12 (F5): the drawdown floor is a per-asset RISK BUDGET, not a global
      # constant. The default −0.12 suits low-vol majors; a 15m high-vol alt
      # (DOGE) cannot meet it even under the regime-gated replay (its gated DD
      # is ~−0.20), so a global floor would be structurally unreachable there.
      # The floor must be measured against the DEPLOYED (regime-gated) replay —
      # ``scored_replay_source`` names which replay the autotuner scores, and the
      # gate evaluator should read the same one. NOTE: this floor is currently
      # advisory/dormant (not yet wired into development_gate_bundle.py); wiring
      # it as an active blocker is a deliberate follow-up — when wired it MUST
      # consume ``max_drawdown_floor_by_instrument`` below.
      max_drawdown_floor: -0.12
      scored_replay_source: economic_replay_regime_gated_v2
      max_drawdown_floor_by_instrument:
        # DOGE_USDT 15m — risk-budgeted to the regime-gated replay band
        # (gated DD ~−0.15…−0.25). Product/risk-approved per-asset value.
        DOGE_USDT_15m: -0.25
      min_trades_per_fold: 20
      threshold_stability_required: true
      worsening_vs_baseline_blocks_promotion: true

  rl_oos:
    required_for_finalists: true
    checks:
      oof_direction_proba_required: true
      oof_volatility_proba_required: true
      feature_provenance_required: true
      feature_bundle_hash_required: true
      proxy_or_neutral_fallback_blocks_promotion: true
      volatility_fallback_blocks_promotion: true
      stale_or_leaked_blocks_promotion: true
      nested_validation_required: true
      multi_seed_required: true
      metrics_required:
        - oos_sharpe
        - return
        - drawdown
        - trade_count
        - mean_absolute_position
        - flip_count
        - is_oos_ratio
        - folds_passed

  inference_parity:
    required: true
    checks:
      feature_name_alignment_required: true
      feature_count_alignment_required: true
      model_roster_parity_required: true
      adapter_loading_required: true
      observation_dimension_parity_required_when_rl_changes: true
      latency_budget_required_for_tsfm: true
      fallback_required_for_tsfm: true

  rollback_readiness:
    required: true
    checks:
      previous_development_version_addressable: true
      rollback_by_instrument_timeframe_supported: true
      rollback_target_recorded: true

  smoke_validation:
    required: true
    checks:
      paper_or_smoke_validation_required: true
      composite_reload_required: true
      prior_version_left_intact_on_failure: true

  signal_health_monitoring:
    required: true
    checks:
      # Dev-scope checks: producible from a sandboxed paper-replay of the
      # candidate (inference-service /admin/paper/replay → probability_summary).
      probability_summary_required: true
      entropy_required: true
      signal_rate_required: true
      # Live-serving telemetry — NOT producible for a never-served candidate.
      # Drift needs a live reference window; operational counters
      # (feature_schema_mismatch_count, adapter_failure_count, rl_hold_rate)
      # are emitted only by a serving instance. Enforced at PRODUCTION scope
      # via production_gate_bundle_v1.yaml live_controls.signal_health_*.
      drift_metrics_required: false
      operational_metrics_required: false
      alerts_block_promotion: false

  inference_reload:
    required: true
    checks:
      feature_alignment_required: true
      adapter_loading_required: true
      roster_parity_required: true
      observation_dimension_parity_required: true
      fallback_behavior_required: true
      latency_budget_required: true
      composite_reload_required: true
      rollback_ready_required: true
      prior_version_preserved_on_reload_failure: true

promotion_blockers:
  - weak_calibration
  - signal_saturation
  - unstable_fold_thresholds
  - missing_economic_replay
  - missing_rl_replay_metrics
  - missing_rl_economic_replay_artifact_hash
  - missing_rl_replay_assumptions
  - missing_rl_profit_score
  - invalid_rl_economic_replay_artifact
  - worsening_post_cost_replay
  - missing_oof_provenance
  - missing_volatility_oof_provenance
  - missing_direction_feature_provenance
  - missing_volatility_feature_provenance
  - incomplete_direction_feature_provenance
  - incomplete_volatility_feature_provenance
  - missing_rl_feature_bundle_hash
  - proxy_or_neutral_direction_proba_fallback
  - proxy_or_neutral_volatility_feature_fallback
  - stale_or_leaked_feature_provenance
  - missing_nested_validation
  - missing_multi_seed_rl_validation
  - missing_rl_oos_metrics
  - inference_feature_schema_mismatch
  - model_roster_mismatch
  - missing_rollback_target
  - failed_smoke_validation
  - missing_signal_health_metrics
  - signal_health_alerts_present
  - inference_reload_validation_missing
  - inference_reload_failed
  - inference_adapter_load_failure
  - tsfm_latency_budget_failure
  - tsfm_adapter_load_failure_without_tabular_fallback

status:
  definition_complete: true
  code_integration_complete: true
  notes:
    - This is the initial machine-readable development gate bundle.
    - Autoresearch promotion previews now include gate bundle evaluation and promotion confirmation blocks on exact bundle blockers.
    - DPU-070 promotion confirmations now persist versioned development-scope metadata and block live/production promotion intent.
    - DPU-071 promotion previews now evaluate explicit rollback readiness and smoke-validation tiers, and confirmations persist addressable rollback snapshots.
    - DPU-072 promotion metadata now emits development direction-signal health metrics and drift/operational summaries.
    - DPU-073 promotion gates now require inference reload/parity validation and prior-version preservation evidence.
    - ARP-011 RL promotion previews now require honest OOS evidence, source feature provenance for direction and volatility inputs, and the consumed feature bundle hash.
    - ARP-010 RL promotion previews now require structured rl_economic_replay.v1 profit evidence; direction and volatility candidates remain supervised feature-readiness promotions without standalone profit scores.
    - ARP-012 keeps this bundle development-only; paper, canary, and production scopes use production_gate_bundle_v1.yaml plus scoped decision artifacts.
