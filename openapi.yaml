          anyOf:
          - type: boolean
          - type: 'null'
          title: Quick Mode
          description: If null, uses server default (standard/full mode)
        max_iterations:
          anyOf:
          - type: integer
            maximum: 500.0
            minimum: 1.0
          - type: 'null'
          title: Max Iterations
        max_budget_usd:
          anyOf:
          - type: number
            maximum: 500.0
            minimum: 0.1
          - type: 'null'
          title: Max Budget Usd
        timeout_minutes:
          anyOf:
          - type: integer
            maximum: 1440.0
            minimum: 30.0
          - type: 'null'
          title: Timeout Minutes
          description: 'Session timeout in minutes (default: server setting, typically 120)'
        focus_hint:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Focus Hint
