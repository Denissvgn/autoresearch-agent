components:
  schemas:
    ContinueResearchRequest:
      description: 'ML-62: Request body for continuing a timed-out/completed session.'
      properties:
        focus_hint:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          description: Optional hint for what to focus on in the continuation
          title: Focus Hint
        max_budget_usd:
          anyOf:
          - maximum: 500.0
            minimum: 0.1
            type: number
          - type: 'null'
          title: Max Budget Usd
        max_iterations:
          anyOf:
          - maximum: 500.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Max Iterations
        timeout_minutes:
          anyOf:
          - maximum: 1440.0
            minimum: 30.0
            type: integer
          - type: 'null'
          description: Session timeout in minutes
          title: Timeout Minutes
      title: ContinueResearchRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    PromotionApproval:
      properties:
        approved:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Approved
        approver:
          anyOf:
          - type: string
          - type: 'null'
          title: Approver
        method:
          anyOf:
          - type: string
          - type: 'null'
          title: Method
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        signature:
          anyOf:
          - type: string
          - type: 'null'
          title: Signature
      title: PromotionApproval
      type: object
    PromotionRollbackRequest:
      properties:
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      title: PromotionRollbackRequest
      type: object
    PromotionScopeRequest:
      properties:
        approval:
          anyOf:
          - $ref: '#/components/schemas/PromotionApproval'
          - type: 'null'
        scope:
          default: development
          title: Scope
          type: string
      title: PromotionScopeRequest
      type: object
    RuntimeResumeRequest:
      description: Explicit operator action for resuming a restart-recovered session.
      properties:
        allow_interrupted:
          default: false
          description: Allow resume from interrupted state when evidence is incomplete.
          title: Allow Interrupted
          type: boolean
        focus_hint:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          description: Optional hint for what to focus on in the continuation
          title: Focus Hint
        max_budget_usd:
          anyOf:
          - maximum: 500.0
            minimum: 0.1
            type: number
          - type: 'null'
          title: Max Budget Usd
        max_iterations:
          anyOf:
          - maximum: 500.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Max Iterations
        reason:
          description: Operator reason for resuming the interrupted session.
          maxLength: 1000
          minLength: 3
          title: Reason
          type: string
        timeout_minutes:
          anyOf:
          - maximum: 1440.0
            minimum: 30.0
            type: integer
          - type: 'null'
          description: Session timeout in minutes
          title: Timeout Minutes
      required:
      - reason
      title: RuntimeResumeRequest
      type: object
    StartResearchRequest:
      properties:
        agent_strategy:
          anyOf:
          - pattern: ^(AGGR|CONS|BALA|SCAL)$
            type: string
          - type: 'null'
          description: 'Agent strategy: AGGR, CONS, BALA, SCAL. RL only.'
          title: Agent Strategy
        enable_hpo:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Enable Optuna HPO screening phase before LLM refinement. RL only.
          title: Enable Hpo
        focus_hint:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          description: Optional hint for the agent about what to focus on
          title: Focus Hint
        hpo_timesteps:
          anyOf:
          - maximum: 500000.0
            minimum: 10000.0
            type: integer
          - type: 'null'
          description: 'Timesteps per HPO trial (default: 50000). RL only.'
          title: Hpo Timesteps
        hpo_trials:
          anyOf:
          - maximum: 200.0
            minimum: 5.0
            type: integer
          - type: 'null'
          description: 'Number of Optuna trials for HPO screening (default: 20). RL only.'
          title: Hpo Trials
        initial_balance:
          anyOf:
          - maximum: 1000000.0
            minimum: 100.0
            type: number
          - type: 'null'
          description: Starting balance in USD for RL training.
          title: Initial Balance
        instrument:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - DOGE_USDT
          title: Instrument
        manifest:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Optional research-session manifest overrides. Immutable identity fields must still match the server-generated session.
          title: Manifest
        max_budget_usd:
          anyOf:
          - maximum: 500.0
            minimum: 0.1
            type: number
          - type: 'null'
          title: Max Budget Usd
        max_iterations:
          anyOf:
          - maximum: 500.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Max Iterations
        model_type:
          anyOf:
          - pattern: ^(direction|volatility|rl|pipeline)$
            type: string
          - type: 'null'
          title: Model Type
        phase_budgets:
          anyOf:
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          description: 'Per-phase iteration budget for pipeline mode: {direction: N, volatility: N, rl: N}'
          title: Phase Budgets
        quick_mode:
          anyOf:
          - type: boolean
          - type: 'null'
          description: If null, uses server default (standard/full mode)
          title: Quick Mode
        skill_id:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - ml-direction
          title: Skill Id
        skill_params:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Canonical skill parameters, validated against the skill's param_schema. Sent alongside skill_id; ignored for legacy shape.
          title: Skill Params
        subject_id:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - DOGE_USDT
          title: Subject Id
        tag:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - doge-apr01
          title: Tag
        timeframe:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - 15m
          title: Timeframe
        timeout_minutes:
          anyOf:
          - maximum: 1440.0
            minimum: 30.0
            type: integer
          - type: 'null'
          description: 'Session timeout in minutes (default: server setting, typically 120)'
          title: Timeout Minutes
        trading_mode:
          anyOf:
          - pattern: ^(stock|margin)$
            type: string
          - type: 'null'
          description: 'Market type: stock (no leverage) or margin (3x leverage). RL only.'
          title: Trading Mode
        variant:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - 15m
          title: Variant
      title: StartResearchRequest
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
