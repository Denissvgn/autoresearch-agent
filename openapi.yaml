components:
  schemas:
    ContinueResearchRequest:
      properties:
        max_iterations:
          anyOf:
          - type: integer
            maximum: 500.0
            minimum: 1.0
          - type: 'null'
          title: Max Iterations
        max_budget_usd:
          anyOf:
          - type: number
            maximum: 500.0
            minimum: 0.1
          - type: 'null'
          title: Max Budget Usd
        timeout_minutes:
          anyOf:
          - type: integer
            maximum: 1440.0
            minimum: 30.0
          - type: 'null'
          title: Timeout Minutes
          description: Session timeout in minutes
        focus_hint:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Focus Hint
          description: Optional hint for what to focus on in the continuation
      type: object
      title: ContinueResearchRequest
      description: 'ML-62: Request body for continuing a timed-out/completed session.'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PromotionApproval:
      properties:
        approver:
          anyOf:
          - type: string
          - type: 'null'
          title: Approver
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        method:
          anyOf:
          - type: string
          - type: 'null'
          title: Method
        signature:
          anyOf:
          - type: string
          - type: 'null'
          title: Signature
        approved:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Approved
      type: object
      title: PromotionApproval
    PromotionRollbackRequest:
      properties:
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      type: object
      title: PromotionRollbackRequest
    PromotionScopeRequest:
      properties:
        scope:
          type: string
          title: Scope
          default: development
        approval:
          anyOf:
          - $ref: '#/components/schemas/PromotionApproval'
          - type: 'null'
      type: object
      title: PromotionScopeRequest
    RuntimeResumeRequest:
      properties:
        max_iterations:
          anyOf:
          - type: integer
            maximum: 500.0
            minimum: 1.0
          - type: 'null'
          title: Max Iterations
        max_budget_usd:
          anyOf:
          - type: number
            maximum: 500.0
            minimum: 0.1
          - type: 'null'
          title: Max Budget Usd
        timeout_minutes:
          anyOf:
          - type: integer
            maximum: 1440.0
            minimum: 30.0
          - type: 'null'
          title: Timeout Minutes
          description: Session timeout in minutes
        focus_hint:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Focus Hint
          description: Optional hint for what to focus on in the continuation
        reason:
          type: string
          maxLength: 1000
          minLength: 3
          title: Reason
          description: Operator reason for resuming the interrupted session.
        allow_interrupted:
          type: boolean
          title: Allow Interrupted
          description: Allow resume from interrupted state when evidence is incomplete.
          default: false
      type: object
      required:
      - reason
      title: RuntimeResumeRequest
      description: Explicit operator action for resuming a restart-recovered session.
    StartResearchRequest:
      properties:
        instrument:
          type: string
          title: Instrument
          examples:
          - DOGE_USDT
        timeframe:
          type: string
          title: Timeframe
          examples:
          - 15m
        model_type:
          type: string
          pattern: ^(direction|volatility|rl|pipeline)$
          title: Model Type
        tag:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag
          examples:
          - doge-apr01
        quick_mode:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Quick Mode
          description: If null, uses server default (standard/full mode)
        max_iterations:
          anyOf:
          - type: integer
            maximum: 500.0
            minimum: 1.0
          - type: 'null'
          title: Max Iterations
        max_budget_usd:
          anyOf:
          - type: number
            maximum: 500.0
            minimum: 0.1
          - type: 'null'
          title: Max Budget Usd
        timeout_minutes:
          anyOf:
          - type: integer
            maximum: 1440.0
            minimum: 30.0
          - type: 'null'
          title: Timeout Minutes
          description: 'Session timeout in minutes (default: server setting, typically
            120)'
        focus_hint:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Focus Hint
          description: Optional hint for the agent about what to focus on
        trading_mode:
          anyOf:
          - type: string
            pattern: ^(stock|margin)$
          - type: 'null'
          title: Trading Mode
          description: 'Market type: stock (no leverage) or margin (3x leverage).
            RL only.'
        agent_strategy:
          anyOf:
          - type: string
            pattern: ^(AGGR|CONS|BALA|SCAL)$
          - type: 'null'
          title: Agent Strategy
          description: 'Agent strategy: AGGR, CONS, BALA, SCAL. RL only.'
        initial_balance:
          anyOf:
          - type: number
            maximum: 1000000.0
            minimum: 100.0
          - type: 'null'
          title: Initial Balance
          description: Starting balance in USD for RL training.
        enable_hpo:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enable Hpo
          description: Enable Optuna HPO screening phase before LLM refinement. RL
            only.
        hpo_trials:
          anyOf:
          - type: integer
            maximum: 200.0
            minimum: 5.0
          - type: 'null'
          title: Hpo Trials
          description: 'Number of Optuna trials for HPO screening (default: 20). RL
            only.'
        hpo_timesteps:
          anyOf:
          - type: integer
            maximum: 500000.0
            minimum: 10000.0
          - type: 'null'
          title: Hpo Timesteps
          description: 'Timesteps per HPO trial (default: 50000). RL only.'
        phase_budgets:
          anyOf:
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          title: Phase Budgets
          description: 'Per-phase iteration budget for pipeline mode: {direction:
            N, volatility: N, rl: N}'
        manifest:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Manifest
          description: Optional research-session manifest overrides. Immutable identity
            fields must still match the server-generated session.
      type: object
      required:
      - instrument
      - timeframe
      - model_type
      title: StartResearchRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
