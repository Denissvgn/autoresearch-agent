components:
  schemas:
    ContinueResearchRequest:
      properties:
        max_iterations:
          anyOf:
          - type: integer
            maximum: 500.0
            minimum: 1.0
          - type: 'null'
          title: Max Iterations
        max_budget_usd:
          anyOf:
          - type: number
            maximum: 500.0
            minimum: 0.1
          - type: 'null'
          title: Max Budget Usd
        timeout_minutes:
          anyOf:
          - type: integer
            maximum: 1440.0
            minimum: 30.0
          - type: 'null'
          title: Timeout Minutes
          description: Session timeout in minutes
        focus_hint:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Focus Hint
          description: Optional hint for what to focus on in the continuation
      type: object
      title: ContinueResearchRequest
      description: 'Request body for continuing a timed-out/completed session.'
    EstimateCostRequest:
      properties:
        max_iterations:
          type: integer
          maximum: 500.0
          minimum: 1.0
          title: Max Iterations
          default: 30
        quick_mode:
