          anyOf:
          - type: string
          - type: 'null'
          description: Correlation identifier used for distributed tracing across services.
          examples:
            default:
              summary: Auto-generated UUID4 when missing; caller-provided value is echoed.
              value: 3a1c2b44-91ec-4ca9-acf8-6d34307c6e7d
          title: X-Request-Id
      - description: Tenant identifier propagated end-to-end for multi-tenant context.
        in: header
        name: X-Tenant-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Tenant identifier propagated end-to-end for multi-tenant context.
          examples:
            default:
              summary: Echo-only; never generated by the platform.
              value: tenant-demo
          title: X-Tenant-Id
      - description: Optional API key for service-to-service authentication when OAuth is unavailable.
        in: header
        name: X-API-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional API key for service-to-service authentication when OAuth is unavailable.
          examples:
            default:
              summary: Forwarded unchanged if provided.
              value: sk_live_example
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Audit Events
      tags:
      - research
