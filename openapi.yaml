                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/research:
    get:
      tags:
      - research
      summary: List Research
      description: 'Paginated session listing.


        Opaque cursor pagination is the primary mode: pass the

        ``next_cursor`` from a prior response to fetch the next page — the response

        is then ``{items, limit, next_cursor}`` (no ``total``). The legacy

        ``offset`` parameter is deprecated; omitting ``cursor`` preserves the

        original ``{items, total, limit, offset}`` envelope exactly.'
      operationId: list_research_api_v1_research_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: model_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Type
      - name: instrument
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Instrument
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          deprecated: true
          default: 0
          title: Offset
        deprecated: true
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: X-Request-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Correlation identifier; auto-generated UUID4 when missing.
          title: X-Request-Id
        description: Correlation identifier; auto-generated UUID4 when missing.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
