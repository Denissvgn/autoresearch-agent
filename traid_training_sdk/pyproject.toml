[tool.poetry]
name = "traid-training-sdk"
version = "0.1.0"
description = "Traid Training SDK"
authors = ["Traid Team"]
readme = "README.md"
packages = [{include = "*", from = "."}]

[tool.poetry.dependencies]
python = "^3.12"
numpy = ">=1.26.0"
pandas = ">=2.3.2"
scikit-learn = "^1.4.0"
joblib = "^1.3.0"
pydantic = "^2.6.0"
torch = "^2.2.0"
mlflow = "^2.10.0"
pandas-ta = ">=0.3.14b"
onnx = "^1.16.0"
onnxscript = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
