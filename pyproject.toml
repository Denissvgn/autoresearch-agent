[tool.poetry]
name = "autoresearch-agent"
version = "0.1.0"
description = "Autonomous ML model tuning agent powered by Claude"
authors = ["Traid Platform Team"]
license = "MIT"
packages = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.109.0"
uvicorn = {version = "^0.27.0", extras = ["standard"]}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
anthropic = "^0.52.0"
openai = "^1.0.0"
pyyaml = "^6.0"
aiosqlite = "^0.20.0"
# ARC-011 P6-002a: raw asyncpg backend for PostgresStateStore (multi-worker).
# Aligns with requirements-workspace.txt's asyncpg>=0.30.0 (training venv).
asyncpg = "^0.30.0"
websockets = "^14.0"
httpx = "^0.27.0"
prometheus-client = "^0.19.0"
psutil = "^5.9.0"
vdmc-core = {path = "libs/vdmc_core", develop = true}
traid-config = {path = "libs/config", develop = true}
data-clients = {path = "libs/data_clients", develop = true}
identity-client = {path = "libs/identity_client", develop = true}
observability = {path = "libs/observability", develop = true}
ml-artifacts = {path = "libs/ml_artifacts", develop = true}
feature-engineering = {path = "libs/feature_engineering", develop = true}
resilience = {path = "libs/resilience", develop = true}
traid-training-sdk = {path = "traid_training_sdk", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
black = "^24.1.0"
isort = "^5.13.0"
mypy = "^1.8.0"
ruff = "^0.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E402", "F401", "F541", "F841"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
disallow_untyped_decorators = false
exclude = [
  "src/api/(audit|promotion|research|results)\\.py",
  "src/core/(command_policy|command_runner|config_promoter|consistency_validator|development_gate_bundle|development_inference_validation|development_signal_health|experiment_parser|iteration_snapshot|log_writer|orchestrator|pipeline_controller|research_manifest|research_phase_plan|research_state|results_store|service_preflight|session_manager|structured_hpo)\\.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "parity: golden-output parity fixtures (ARC-011 X-002)",
    "postgres: requires a live Postgres (AUTORESEARCH_DATABASE_URL); skipped otherwise (ARC-011 P6-002a)",
    "distributed: requires a live Postgres + multi-process harness; skipped otherwise (ARC-011 P6-007)",
]
