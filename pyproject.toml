[tool.poetry]
name = "autoresearch-agent"
version = "0.1.0"
description = "Autonomous ML model tuning agent powered by Claude"
authors = ["Traid Platform Team"]
packages = []

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {version = "^0.34.0", extras = ["standard"]}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
anthropic = "^0.52.0"
pyyaml = "^6.0"
aiosqlite = "^0.20.0"
websockets = "^14.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
ruff = "^0.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
