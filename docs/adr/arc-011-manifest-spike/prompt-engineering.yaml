# -*- yaml -*-
# ARC-011 manifest spike (X-003) — DRAFT, not a live skill.
#
# id: prompt-engineering  (category: generative)
#
# A generative peer whose harness is an eval scorer, not a trainer. Lifted to v1
# completeness from Analysis §9. Exercises gaps G5 (registry_api promotion) and
# G12 (script-driven subject/variant enumeration).
#
# Section presence (X-003 AC): all eight required sections populated:
#   param_schema | metric_schema | decision_vocabulary | phase_plan
#   command_policy | output_parser | preflight | promotion_target

schema_version: research_skill.v1
id: prompt-engineering
version: 0.3.0
category: generative
display_name: "Prompt Engineering Research"
description: "Iterate prompt variants against an eval set and promote the winner."

llm:
  provider: router                      # model-router for price/quality arbitrage
  primary_model: claude-sonnet-4-20250514
  insight_model: claude-haiku-4-20250514
  max_output_tokens: 8192
  system_prompt: SKILL.md

workspace:
  session_path_template: "runs/{skill_id}/{subject_id}/{variant}"

# G12: subjects/variants enumerated by scripts (e.g. "support-bot-v2" × "production").
subjects:
  enumerator: scripts/list_subjects.py
  cache_ttl_s: 300
variants:
  enumerator: scripts/list_variants.py

# ── 1/8 param_schema ──────────────────────────────────────────────────────────
param_schema:
  type: object
  additionalProperties: false
  properties:
    eval_set:      { type: string,  description: "path/URL to the labeled eval set" }
    scorer_url:    { type: string,  description: "endpoint that scores a candidate prompt" }
    registry_url:  { type: string,  description: "prompt registry base URL" }
    target_metric: { type: string, enum: [composite_eval_score, precision, f1], default: composite_eval_score }
    cost_ceiling_per_run_usd: { type: number, minimum: 0, default: 0.50 }
  required: [eval_set, scorer_url, registry_url]

# ── 2/8 metric_schema ─────────────────────────────────────────────────────────
metric_schema:
  primary:
    field: primary_metric
    label: "Composite Eval Score"
    direction: higher_is_better
    format: ".4f"
  gates:
    - { field: passes_min_precision, label: "Min Precision", kind: boolean_badge }
    - { field: within_cost_budget,   label: "Cost Budget",    kind: boolean_badge }
  chart_series:
    - { field: composite_eval_score, label: "Score" }
    - { field: precision,            label: "Precision" }
    - { field: mean_cost_usd,        label: "$/run", axis: right }
  iteration_table_columns:
    - { field: primary_metric,   label: "Score" }
    - { field: passes_min_precision, label: "Prec", kind: icon }
    - { field: within_cost_budget,   label: "Cost", kind: icon }
    - { field: n_eval_examples,  label: "N" }
  goal: optimize

# ── 3/8 decision_vocabulary (G8 success_values) ───────────────────────────────
decision_vocabulary:
  base:           [keep, discard, improve, unknown]
  extensions:     []
  success_values: [keep, improve]

# ── 4/8 phase_plan (declarative advancement suffices for generative) ──────────
phase_plan:
  - { id: baseline_capture,         min_iterations: 1, max_iterations: 2,  evidence_keys: [baseline_score],         stagnation_exempt: false }
  - { id: strategy_sweep,           min_iterations: 4, max_iterations: 20, evidence_keys: [prompt_strategy],        stagnation_exempt: false,
      next_action: "Try few-shot, chain-of-thought, role, and self-critique variants." }
  - { id: robustness,               min_iterations: 3, max_iterations: 10, evidence_keys: [paraphrase_invariance, adversarial_pass], stagnation_exempt: false,
      next_action: "Paraphrase and adversarial eval." }
  - { id: cost_precision_tradeoff,  min_iterations: 2, max_iterations: 6,  evidence_keys: [cost_curve_point] }
  - { id: promotion_proposal,       min_iterations: 1, max_iterations: 2,  evidence_keys: [promotion_proposal] }
phase_advancement:
  mode: declarative              # evidence-key presence + min_iterations floor

# ── 5/8 command_policy ────────────────────────────────────────────────────────
command_policy:
  allowed_python: [".venv/bin/python"]
  allowed_scripts:
    - eval/run.py                  # score a candidate prompt
    - eval/render.py               # render a prompt template
  allowed_executables: [cp, cat, jq]
  copyable_files: [prompt.yaml, best_prompt.yaml]
  readable_files: [prompt.yaml, best_prompt.yaml, eval_result.json]
  forbidden_tokens: ["|", "||", "&&", ";", "&"]
  forbidden_substrings: ["`", "$", ">", "<", "\n", "\r"]
  secret_markers: [.env, /proc/, /run/secrets, authorization, bearer, credential, id_rsa, password, secret, token]

# ── 6/8 output_parser (json_marker) ───────────────────────────────────────────
output_parser:
  format: json_marker
  iteration_marker: "ITERATION_RESULT:"
  nonce_field: server_nonce
  required_fields: [status, primary_metric, metric_name, n_eval_examples]
  failure_statuses: [eval_error, timeout]
  fallback:
    read_results_file: eval_result.json
    # Generative skills write into the workspace root.
    marker_dir_template: "{workspace}/"

# ── 7/8 preflight (G6 {settings.*} interpolation) ─────────────────────────────
preflight:
  - { name: eval-set,   kind: local_file,  path: "{workspace}/eval_set.jsonl", required: true }
  - { name: scorer-api, kind: http_health, url: "{skill_params.scorer_url}",   required: true }
  - { name: registry,   kind: http_health, url: "{skill_params.registry_url}", required: true }

# ── 8/8 promotion_target (G5 registry_api) ────────────────────────────────────
promotion_target:
  primary:
    kind: registry_api
    registry: prompt-registry
    register_endpoint: "{skill_params.registry_url}/api/v1/prompts"
    atomic_write: true
  scopes:
    - { id: development, approval_required: false }
    - { id: staging,     approval_required: false, prior_scopes: [development] }
    - id: production
      approval_required: true
      prior_scopes: [development, staging]
      delegate:
        kind: registry_api
        registry: prompt-registry
        endpoint: "{skill_params.registry_url}/api/v1/prompts/{prompt_id}/promote"
        auth_secret: PROMPT_REGISTRY_AUTH_TOKEN

trial_identity:
  hash_fields: [skill_id, subject_id, variant, prompt_template_hash, eval_set_hash]
  resolve: { mode: declarative }

blocker_classification:
  actionable_blockers: [below_min_precision, cost_budget_exceeded, scorer_unavailable]
  phase_evidence_keys: {}

structured_hpo:
  enabled: false

insights:
  prompt_template: insights.md
  model: claude-haiku-4-20250514
  max_chars: 500

prompt:
  experiment_command: |
    .venv/bin/python eval/run.py --prompt {workspace}/prompt.yaml --eval {workspace}/eval_set.jsonl
  continuation_enabled: true

ui:
  form_fields:
    - { name: eval_set,      type: string, required: true, label: "Eval set path/URL" }
    - { name: scorer_url,    type: string, required: true }
    - { name: registry_url,  type: string, required: true }
    - { name: target_metric, type: enum, options: [composite_eval_score, precision, f1], default: composite_eval_score }
