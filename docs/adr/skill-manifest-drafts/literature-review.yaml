# -*- yaml -*-
# ARC-011 manifest spike (X-003) — DRAFT, not a live skill.
#
# id: literature-review  (category: exploratory)
#
# Promoted artifact is a synthesized report bundle, not a config. Exercises the
# artifact_store promotion target (G10 — multi-file bundle), a coverage_recall
# metric with goal: satisfice (G11), and script-based subject enumeration (G12).
# Demonstrates the schema serves a non-numeric-output, report-as-artifact domain.
#
# Section presence (X-003 AC): all eight required sections populated:
#   param_schema | metric_schema | decision_vocabulary | phase_plan
#   command_policy | output_parser | preflight | promotion_target

schema_version: research_skill.v1
id: literature-review
version: 0.2.0
category: exploratory
display_name: "Literature Review / Knowledge Synthesis"
description: "Discover sources, extract claims, synthesize a knowledge graph, and validate against a held-out QA set."

llm:
  provider: router
  primary_model: claude-sonnet-4-20250514
  insight_model: claude-haiku-4-20250514
  max_output_tokens: 8192
  system_prompt: SKILL.md

workspace:
  session_path_template: "runs/{skill_id}/{subject_id}/{variant}"

# G12: subject = research topic; variant = question set / eval partition.
subjects:
  enumerator: scripts/list_topics.py
  cache_ttl_s: 86400
variants:
  static: [open_qa, held_out_qa]

# ── 1/8 param_schema ──────────────────────────────────────────────────────────
param_schema:
  type: object
  additionalProperties: false
  properties:
    source_corpus_url: { type: string, description: "search API / corpus endpoint" }
    qa_eval_set:       { type: string, description: "held-out QA set for coverage recall" }
    min_coverage:      { type: number, minimum: 0, maximum: 1, default: 0.7 }
    max_citations:     { type: integer, minimum: 1, default: 200 }
  required: [source_corpus_url, qa_eval_set]

# ── 2/8 metric_schema (G11: goal satisfice — no single winner) ────────────────
metric_schema:
  primary:
    field: primary_metric
    label: "Coverage Recall"
    direction: higher_is_better
    format: ".3f"
    primary_metric_jsonpath: ["coverage_recall"]
  gates:
    - { field: min_coverage_met,               label: "Coverage",   kind: boolean_badge }
    - { field: no_hallucinated_citations,      label: "No Halluc",  kind: boolean_badge }
  chart_series:
    - { field: coverage_recall,   label: "Recall" }
    - { field: sources_curated,   label: "Sources", axis: right }
    - { field: claims_extracted,  label: "Claims",  axis: right }
  iteration_table_columns:
    - { field: primary_metric,         label: "Recall" }
    - { field: min_coverage_met,       label: "Cov",  kind: icon }
    - { field: no_hallucinated_citations, label: "Halluc", kind: icon }
    - { field: sources_curated,        label: "Srcs" }
  # G11: exploratory — meet the threshold; there is no "best" recall to optimize
  # in isolation, only a sufficient-coverage gate.
  goal: satisfice
  satisfice_threshold_field: min_coverage_met

# ── 3/8 decision_vocabulary ───────────────────────────────────────────────────
decision_vocabulary:
  base:           [keep, discard, improve, unknown]
  extensions:     [superseded, merged]
  success_values: [keep, improve]

# ── 4/8 phase_plan ────────────────────────────────────────────────────────────
phase_plan:
  - { id: scope,              min_iterations: 1, max_iterations: 3,  evidence_keys: [scope_defined] }
  - { id: source_discovery,   min_iterations: 3, max_iterations: 20, evidence_keys: [sources_curated],
      next_action: "Query the corpus; deduplicate and curate sources." }
  - { id: extraction,         min_iterations: 3, max_iterations: 25, evidence_keys: [claims_extracted] }
  - { id: synthesis,          min_iterations: 2, max_iterations: 10, evidence_keys: [graph_built] }
  - { id: validation,         min_iterations: 1, max_iterations: 5,  evidence_keys: [qa_eval_passed] }
  - { id: promotion_proposal, min_iterations: 1, max_iterations: 2,  evidence_keys: [report_drafted] }
phase_advancement:
  mode: declarative

# ── 5/8 command_policy ────────────────────────────────────────────────────────
command_policy:
  allowed_python: [".venv/bin/python"]
  allowed_scripts:
    - search/query.py             # query the source corpus
    - graph/build.py              # build the claim graph
    - eval/answer_questions.py    # score recall against the QA set
  allowed_executables: [cat, jq]
  copyable_files: [report.md, best_report.md]
  readable_files: [report.md, best_report.md, graph.json, qa_result.json]
  forbidden_tokens: ["|", "||", "&&", ";", "&"]
  forbidden_substrings: ["`", "$", ">", "<", "\n", "\r"]
  secret_markers: [.env, /proc/, /run/secrets, authorization, bearer, credential, id_rsa, password, secret, token]

# ── 6/8 output_parser ─────────────────────────────────────────────────────────
output_parser:
  format: json_marker
  iteration_marker: "ITERATION_RESULT:"
  nonce_field: server_nonce
  required_fields: [status, primary_metric, metric_name, sources_curated]
  failure_statuses: [eval_error, timeout, corpus_unavailable]
  fallback:
    read_results_file: qa_result.json
    marker_dir_template: "{workspace}/"

# ── 7/8 preflight ─────────────────────────────────────────────────────────────
preflight:
  - { name: corpus,  kind: http_health,  url: "{skill_params.source_corpus_url}", required: true }
  - { name: qa-set,  kind: local_file,   path: "{workspace}/{skill_params.qa_eval_set}", required: true }

# ── 8/8 promotion_target (G10: artifact_store multi-file bundle) ──────────────
promotion_target:
  primary:
    kind: artifact_store
    path_template: "artifacts/reviews/{subject_id}/{variant}/"
    atomic_write: true
    # G10: a report + graph + citations bundle, not a single file.
    bundle_manifest: bundle.manifest.json
    bundle_artifacts:
      - report.md
      - graph.json
      - citations.jsonl
      - qa_result.json
  scopes:
    - { id: development, approval_required: false }
    - { id: production,  approval_required: true, prior_scopes: [development] }

blocker_classification:
  actionable_blockers: [low_recall, hallucinated_citation, claim_contradiction, source_gap]
  phase_evidence_keys:
    source_discovery: [sources_curated]
    extraction:       [claims_extracted]
    synthesis:        [graph_built]
    validation:       [qa_eval_passed]
    promotion_proposal: [report_drafted]

trial_identity:
  hash_fields: [skill_id, subject_id, variant, corpus_hash, qa_eval_hash]
  resolve: { mode: declarative }

structured_hpo:
  enabled: false

insights:
  prompt_template: insights.md
  model: claude-haiku-4-20250514
  max_chars: 500

prompt:
  experiment_command: |
    .venv/bin/python eval/answer_questions.py --graph {workspace}/graph.json --qa {workspace}/{skill_params.qa_eval_set}
  continuation_enabled: true

ui:
  form_fields:
    - { name: source_corpus_url, type: string, required: true, label: "Source corpus / search API" }
    - { name: qa_eval_set,       type: string, required: true, label: "Held-out QA set" }
    - { name: min_coverage,      type: number, default: 0.7, min: 0, max: 1 }
    - { name: max_citations,     type: integer, default: 200 }
