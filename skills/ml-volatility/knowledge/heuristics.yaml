# ML Volatility — tuning heuristics (declarative hints for the agent).
primary_metric: auc
direction: higher_is_better

# Hard constraint: positive_rate outside this band is a revert regardless of AUC.
positive_rate_band: [0.10, 0.40]

healthy_ranges:
  auc: [0.55, 0.70]

priority_levers:
  - atr_multiplier        # the dominant sensitivity lever
  - decision_threshold    # tunes positive_rate into band
  - feature_selection     # remember: exclude atr_ratio + bb_width

anti_patterns:
  - keeping a high-AUC config with positive_rate outside 10–40%
  - changing feature_library_version without coordinating with direction
  - including atr_ratio or bb_width in the volatility feature set
