# ARC-011 P2-013 — the live `ml-rl` skill descriptor.
#
# Authored from FALLBACK_PHASES (research_phase_plan.py:129-158) — the RL phase
# plan — plus the RL-specific OOS evidence keys (research_phase_plan.py:481-488)
# and the RL-only params (trading_mode/agent_strategy/initial_balance).
#
# ⚠️ Grounding note: there is NO `RL_PHASES` constant (the backlog's P2-022 name
# is stale — AC-deviation). RL uses FALLBACK_PHASES; the only RL divergence is
# the `validation` phase requiring ≥2 iterations carrying one of
# RL_OOS_EVIDENCE_KEYS (_completed_phase_ids:543-548). That rule belongs in the
# phases.py plugin (G1). This is the one place ml-rl diverges from a flat
# declarative phase plan.
#
# category: optimization (RL/PPO trading agent autotuner)
# Sections present: all eight required + trial_identity, blocker_classification,
# structured_hpo, insights, prompt, ui.

schema_version: research_skill.v1
id: ml-rl
version: 1.0.0
category: optimization
display_name: "ML RL (PPO) Model Tuning"
description: "Tune reinforcement-learning PPO trading agents via walk-forward training."

# ── LLM tier routing ──────────────────────────────────────────────────────────
llm:
  provider: anthropic
  primary_model: claude-sonnet-4-20250514
  insight_model: claude-haiku-4-20250514
  max_output_tokens: 8192
  system_prompt: SKILL.md

# ── Workspace layout ──────────────────────────────────────────────────────────
workspace:
  session_path_template: "runs/{skill_id}/{subject_id}/{variant}"

# ── Subject / variant enumeration (G12) ───────────────────────────────────────
subjects:
  enumerator: scripts/list_subjects.py
  cache_ttl_s: 60
variants:
  static: ["5m", "15m", "1h", "4h"]

# ── 1/8 param_schema ──────────────────────────────────────────────────────────
# RL declares the RL-only fixed settings (trading_mode / agent_strategy /
# initial_balance) that direction/volatility omit, plus the HPO fields.
param_schema:
  type: object
  additionalProperties: false
  properties:
    enable_hpo:      { type: boolean, default: false }
    hpo_trials:      { type: integer, minimum: 5,    maximum: 200,    default: 20 }
    hpo_timesteps:   { type: integer, minimum: 10000, maximum: 500000, default: 50000 }
    trading_mode:    { type: string, enum: [stock, margin] }
    agent_strategy:  { type: string, enum: [AGGR, CONS, BALA, SCAL] }
    initial_balance: { type: number, minimum: 0 }
  required: []

# ── 2/8 metric_schema ─────────────────────────────────────────────────────────
# RL primary metric; direction "higher_is_better".
metric_schema:
  primary:
    field: primary_metric
    label: "RL Profit Score"
    direction: higher_is_better
    format: ".4f"
    primary_metric_jsonpath: ["composite_rl_score", "metrics.rl_profit_score"]
  gates:
    - { field: all_gates_passed,       label: "All Gates",  kind: boolean_badge }
    - { field: training_gates_passed,  label: "Train Gates", kind: boolean_badge }
  chart_series:
    - { field: primary_metric,    label: "RL Score" }
    - { field: mean_oos_sharpe,   label: "OOS Sharpe", axis: right }
    - { field: mean_oos_return,   label: "OOS Return", axis: right }
  iteration_table_columns:
    - { field: primary_metric,   label: "Metric" }
    - { field: all_gates_passed, label: "Gates", kind: icon }
    - { field: folds_passed,     label: "Folds" }
    - { field: training_time_s,  label: "Time",  format: duration_seconds }
  goal: optimize

# ── 3/8 decision_vocabulary (G8 adds success_values) ──────────────────────────
decision_vocabulary:
  base:          [keep, discard, improve, unknown]
  extensions:    [hpo_screening]
  success_values: [keep, improve, hpo_screening]

# ── 4/8 phase_plan (G1: hybrid advancement → phases.py plugin) ────────────────
# Phase literals reproduce FALLBACK_PHASES (research_phase_plan.py:129-158).
# The `validation` phase additionally requires ≥2 iterations carrying one of
# RL_OOS_EVIDENCE_KEYS (research_phase_plan.py:481-488); that hybrid rule is
# owned by the phases.py plugin, not the declarative evidence_keys here.
phase_plan:
  - id: baseline_capture
    label: "Baseline Capture"
    min_iterations: 1
    max_iterations: 3
    evidence_keys: []
    next_action: "Run the baseline config and record the first server-owned attempt."
    stagnation_exempt: false
  - id: hpo_screening
    label: "HPO Screening"
    min_iterations: 1
    max_iterations: 20
    evidence_keys: []
    next_action: "Run or inspect bounded HPO trials when enabled."
    stagnation_exempt: false
  - id: validation
    label: "Validation"
    min_iterations: 2
    max_iterations: 10
    # Declarative share of the RL validation gate. The phases.py plugin ALSO
    # requires ≥2 iterations carrying one of RL_OOS_EVIDENCE_KEYS (mean_oos_sharpe,
    # rl_profit_score, folds_passed, oos_sharpe, trading_score, mean_oos_return).
    evidence_keys:
      [mean_oos_sharpe, rl_profit_score, folds_passed, oos_sharpe, trading_score, mean_oos_return]
    next_action: "Validate candidate metrics and gates against the manifest budget."
    stagnation_exempt: false
  - id: promotion_proposal
    label: "Promotion Proposal"
    min_iterations: 0
    max_iterations: 4
    evidence_keys:
      [development_promotion_metadata, promotion_allowed, promotion_consistency_report,
       promotion_decision, promotion_metadata, promotion_preview_ready, promotion_scope,
       scoped_promotion_metadata]
    next_action: "Prepare a development-scoped promotion proposal when gates pass."
    stagnation_exempt: true
phase_advancement:
  # ARC-011 review C2 (2026-08-15): plugin file never shipped — declare the
  # declarative evidence-key resolution the runtime actually performs.
  mode: declarative

# ── 5/8 command_policy ────────────────────────────────────────────────────────
# Reproduces command_policy.py:11-61 verbatim, narrowed to RL's scripts.
# RL adds enrich_rl_dataset.py (the RL dataset-enrichment step).
command_policy:
  allowed_python: [".venv/bin/python", "./.venv/bin/python"]
  allowed_scripts:
    - scripts/autotuner/setup.py
    - scripts/autotuner/rl/prepare.py
    - scripts/autotuner/enrich_rl_dataset.py
    - scripts/autotuner/resume.py
  allowed_executables: [cp, cat]
  copyable_files: [train.yaml, best_train.yaml]
  readable_files: [train.yaml, best_train.yaml, results.json, last_metrics.txt, hpo_results.json]
  forbidden_tokens: ["|", "||", "&&", ";", "&"]
  forbidden_substrings: ["`", "$", ">", "<", "\n", "\r"]
  secret_markers: [.env, /proc/, /run/secrets, authorization, bearer, credential, id_rsa, password, secret, token]

# ── 6/8 output_parser (G7) ────────────────────────────────────────────────────
output_parser:
  format: delimited_kv
  block_delimiter: "---"
  iteration_marker: "ITERATION_RESULT:"
  nonce_field: server_nonce              # W11 anti-forgery (Phase 4)
  required_fields: [status, primary_metric, metric_name, all_gates_passed]
  field_types:
    primary_metric: float
    training_time_s: float
    all_gates_passed: bool
    training_gates_passed: bool
  failure_statuses: [crash, timeout, failed, error, pruned, auth_failed, gpu_busy]
  fallback:
    read_marker_file: last_metrics.txt
    read_results_file: results.json
    marker_dir_template: "{workspace_root}/runs/autotuner/{subject_id_underscore}_{variant}/rl/"

# ── 7/8 preflight (G6: {settings.*} interpolation) ────────────────────────────
# RL requires vdmc in addition to the direction/volatility set (service_preflight.py:40-45).
preflight:
  - { name: mlflow_tracking,  kind: http_health, url: "{settings.mlflow_tracking_uri}", health_paths: ["/health", "/"], required: true,  timeout_s: 3.0 }
  - { name: mlflow_service,   kind: http_health, url: "{settings.mlflow_service_url}",   required: true }
  - { name: data_ingest,      kind: http_health, url: "{settings.data_ingest_url}",      health_paths: ["/readiness", "/health"], required: true }
  - { name: ensemble_trainer, kind: http_health, url: "{settings.ensemble_trainer_url}", health_paths: ["/health/ready", "/health"], required: true }
  - { name: rl_trainer,       kind: http_health, url: "{settings.rl_trainer_url}",       health_paths: ["/health/ready", "/health"], required: true }
  - { name: feature_service,  kind: http_health, url: "{settings.feature_service_url}",  required: true }
  - { name: vdmc,             kind: http_health, url: "{settings.inference_service_url}", health_paths: ["/health", "/readiness"],  required: true }

# ── 8/8 promotion_target (G4 gate bundles, G5 registry_api enrichment) ────────
promotion_target:
  primary:
    kind: file_path
    path_template: "{settings.host_configs_path}/instrument_configs/{subject_id}_{variant}.yaml"
    sidecar_extensions: [".development-promotion.iter-{iteration}.json"]
    rollback_template: "{target_path}.development-rollback.{research_id}.iter-{iteration}.yaml"
    atomic_write: true
  gate_bundles:
    development:        "reports/rl-tuning/promotion/development_gate_bundle_v1.yaml"
    production:         "reports/rl-tuning/promotion/production_gate_bundle_v1.yaml"
    overrides_location: "configs/instrument_configs/{subject_id}_{variant}.yaml#gates_overrides"
  scopes:
    - { id: development, approval_required: false }
    - { id: paper,       approval_required: true,  prior_scopes: [development] }
    - { id: canary,      approval_required: true,  prior_scopes: [development, paper] }
    - id: production
      approval_required: true
      prior_scopes: [development, paper, canary]
      delegate:
        kind: registry_api
        registry: mlflow-service
        endpoint: "{settings.mlflow_service_url}/api/v1/composites/{composite_id}/promote"
        lookup:
          by: serving_model_version
          query_endpoint: "{settings.mlflow_service_url}/api/v1/composites?instrument={subject_id}&page_size=100"
        auth_secret: AUTORESEARCH_MLFLOW_SERVICE_AUTH_TOKEN
        rollup_metric: rollup_score

# ── Trial identity (G2: resolve_identity.py plugin) ───────────────────────────
trial_identity:
  hash_fields: [skill_id, subject_id, variant, canonical_config_hash, quick_mode, data_split_id]
  resolve:
    # ARC-011 review C2 (2026-08-15): plugin file never shipped; identity is
    # resolved by the ``hash_fields`` hash (declarative), as the runtime does.
    mode: declarative

# ── Blocker classification (G3) ───────────────────────────────────────────────
blocker_classification:
  actionable_blockers:
    [signal_saturation, weak_calibration, unstable_fold_thresholds,
     best_metric_below_development_baseline,
     missing_brier_score, missing_reliability_diagram,
     missing_threshold_stability_by_fold, missing_signal_rate_distribution,
     missing_per_regime_calibration_status]
  phase_evidence_keys:
    validation:          [mean_oos_sharpe, rl_profit_score, folds_passed, oos_sharpe, trading_score, mean_oos_return]
    promotion_proposal:  [development_promotion_metadata, promotion_allowed, smoke_validation, signal_health]

# ── Structured HPO (RL is the primary HPO consumer) ───────────────────────────
structured_hpo:
  enabled: false                  # toggled by skill_params.enable_hpo
  plan_generator: scripts/generate_hpo_plan.py
  max_trials: 200

# ── Insights (G9) ─────────────────────────────────────────────────────────────
insights:
  prompt_template: insights.md
  model: claude-haiku-4-20250514
  max_chars: 500

# ── Prompt templates ──────────────────────────────────────────────────────────
prompt:
  setup_command: |
    .venv/bin/python scripts/autotuner/setup.py --subject {subject_id} --variant {variant} --models rl
  experiment_command: |
    .venv/bin/python scripts/autotuner/rl/prepare.py --config {workspace}/train.yaml{quick_flag}
  continuation_enabled: true
  anti_waste_rules: CLAUDE.md

# ── UI hints ──────────────────────────────────────────────────────────────────
ui:
  form_fields:
    - { name: enable_hpo,      type: boolean, default: false, group: "Advanced" }
    - { name: hpo_trials,      type: integer, default: 20,    min: 5, max: 200, group: "Advanced" }
    - { name: hpo_timesteps,   type: integer, default: 50000, min: 10000, max: 500000, group: "Advanced" }
    - { name: trading_mode,    type: string,  enum: [stock, margin], group: "RL" }
    - { name: agent_strategy,  type: string,  enum: [AGGR, CONS, BALA, SCAL], group: "RL" }
    - { name: initial_balance, type: number,  min: 0, group: "RL" }
  chart:
    primary_metric_label: "RL Profit Score"
    gates_badge: true
