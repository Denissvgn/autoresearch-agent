# ML RL (PPO) — tuning heuristics (declarative hints for the agent).
primary_metric: mean_oos_sharpe
direction: higher_is_better

# Critical companion: a high-Sharpe config with a deep drawdown is unstable.
drawdown_guard_metric: mean_oos_drawdown
drawdown_guard_direction: lower_magnitude_is_better

healthy_ranges:
  mean_oos_sharpe: [0.5, 2.5]
  mean_oos_drawdown: [-0.25, 0.0]   # magnitude; deeper than -25% is a revert

priority_levers:
  - reward_weights.action_penalty
  - reward_weights.drawdown_penalty
  - reward_weights.profit_reward
  - ppo.ent_coef
  - ppo.clip_range
  - ppo.n_steps

anti_patterns:
  - starting RL before direction + volatility are trained for the instrument
  - keeping a high-Sharpe config with drawdown worse than -25%
  - modifying FIXED settings flagged in the bootstrap prompt
  - sweeping ent_coef without watching for overtrading/undertrading symptoms
