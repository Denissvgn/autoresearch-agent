name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live:
        description: "Run opt-in live qualification (external harness CLIs)"
        type: boolean
        default: false
      live_budget_usd:
        description: "Budget cap for live qualification jobs"
        type: string
        default: "5.00"

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Poetry metadata check
        run: poetry check

      - name: Lockfile check
        run: poetry check --lock

      - name: Build release archives
        run: |
          # Poison local-only directories so archive checks catch broad includes.
          trap 'rm -rf skills/_drafts/ci-sentinel skills/ci-unbundled' EXIT
          mkdir -p skills/_drafts/ci-sentinel skills/ci-unbundled
          printf 'not a release asset\n' > skills/_drafts/ci-sentinel/SKILL.yaml
          printf 'not a release asset\n' > skills/ci-unbundled/SKILL.yaml
          poetry build --output "$RUNNER_TEMP/release-dist"

      - name: Check release archive contents
        env:
          AUTORESEARCH_DIST_DIR: ${{ runner.temp }}/release-dist
        run: poetry run pytest tests/test_packaging.py -q

      - name: Smoke test installed wheel outside checkout
        env:
          AUTORESEARCH_DEMO: "true"
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke-venv"
          "$RUNNER_TEMP/wheel-smoke-venv/bin/python" -m pip install "$RUNNER_TEMP"/release-dist/*.whl
          mkdir -p "$RUNNER_TEMP/wheel-smoke-cwd"
          cd "$RUNNER_TEMP/wheel-smoke-cwd"
          "$RUNNER_TEMP/wheel-smoke-venv/bin/python" -I - <<'PY'
          import sysconfig
          from pathlib import Path
          from src.core.skill_registry import DEFAULT_SKILLS_ROOT, SkillRegistry

          site_packages = Path(sysconfig.get_path("purelib")).resolve()
          assert DEFAULT_SKILLS_ROOT == site_packages / "skills", DEFAULT_SKILLS_ROOT
          registry = SkillRegistry()
          expected = {"code-refactor", "db-config-tuning", "prompt-engineering"}
          assert set(registry.discover()) == expected
          for skill_id in expected:
              assert registry.get(skill_id).id == skill_id
              for asset in ("SKILL.yaml", "SKILL.md", "bootstrap.py", "eval/run.py"):
                  assert (DEFAULT_SKILLS_ROOT / skill_id / asset).is_file()
          print("Installed wheel discovers and loads all bundled skills")
          PY

      - name: Domain-coupling guard
        run: python scripts/check_domain_coupling.py

      - name: Referenced-doc integrity guard
        # A code comment referencing a docs/*.md path that does not exist
        # fails the build, so deleted/renamed docs cannot leave stale
        # references behind.
        run: python scripts/check_doc_references.py

      - name: Legacy-vocabulary branching guard
        # New code must key on the skill manifest, not the frozen legacy
        # model_type vocabulary; branching on it is allowlisted to the
        # frozen legacy surfaces.
        run: python scripts/check_legacy_vocab_branching.py

      - name: Ruff
        run: poetry run ruff check --config pyproject.toml src tests --output-format=github

      - name: Mypy
        run: poetry run mypy src --no-error-summary

      # The non-ML end-to-end proof as a DISTINCT check, so branch
      # protection can require it by name (it also runs inside the full
      # suite below — this step exists for visibility and a fast signal).
      - name: Non-ML session e2e
        env:
          ANTHROPIC_BASE_URL: http://anthropic.invalid
          ANTHROPIC_AUTH_TOKEN: test-token
        run: poetry run pytest tests/test_non_ml_session_e2e.py -q

      - name: Pytest
        env:
          ANTHROPIC_BASE_URL: http://anthropic.invalid
          ANTHROPIC_AUTH_TOKEN: test-token
        run: poetry run pytest tests -q

  smoke:
    # The scripted Docker smoke — build the real image and prove readiness,
    # the installed skills, and a real prompt-engineering demo session
    # reaching an iteration.
    name: Docker Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Smoke test the built image
        run: scripts/smoke_docker.sh

  distributed:
    # Runs the postgres/distributed-marked tests against a real Postgres
    # service plus the multi-process distributed harness. The default
    # `test` job has no Postgres (those tests skip there); this job is
    # the dedicated gate.
    name: Distributed (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Pytest (postgres + distributed markers)
        env:
          ANTHROPIC_BASE_URL: http://anthropic.invalid
          ANTHROPIC_AUTH_TOKEN: test-token
          AUTORESEARCH_DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: poetry run pytest -m "postgres or distributed" -vv

  ui:
    name: UI Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci --ignore-scripts

      - name: Typecheck
        working-directory: ui
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        # Include matcher types: vitest.setup.ts is outside tsconfig's src include.
        run: npx --no-install tsc --noEmit --types vitest/globals,@testing-library/jest-dom

      - name: Vitest
        working-directory: ui
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        # The pool/worker flags are a GitHub-runner memory constraint only —
        # they do not change test semantics. Locally `npm run test:unit -- --run`
        # (default pool) runs the same suite.
        run: npm run test:unit -- --pool=forks --maxWorkers=1 --minWorkers=1 --no-file-parallelism

      - name: Build
        working-directory: ui
        run: npx vite build

      - name: Production ops tests
        working-directory: ui
        run: node scripts/run-production-ops-tests.mjs

  qualification-gates:
    # Named deterministic qualification gates: trust, domain semantics,
    # migrations, cross-store behavior, adapters, API/CLI/UI, deployment
    # artifacts. Missing coverage, unowned skips, drifted qualification
    # inputs, incomplete unsupported-capability reports, and secrets in
    # evidence all fail this job.
    name: Qualification Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Run qualification gates
        env:
          ANTHROPIC_BASE_URL: http://anthropic.invalid
          ANTHROPIC_AUTH_TOKEN: test-token
        run: poetry run python scripts/ci_qualification_gates.py

      - name: Archive sanitized gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-gates-evidence
          path: workspace/qualification/ci/
          if-no-files-found: warn

  live-qualification:
    # Opt-in live external checks — visibly separate from the mock and
    # fixture lanes above. Requires scoped credentials (repository
    # secrets, never archived) and a declared budget cap.
    name: Live Qualification (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Run live qualification gates
        env:
          AUTORESEARCH_LIVE_JOBS: "1"
          AUTORESEARCH_LIVE_BUDGET_USD: ${{ inputs.live_budget_usd }}
          AUTORESEARCH_CODEX_LIVE: "1"
          AUTORESEARCH_CLAUDE_LIVE: "1"
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LIVE_ANTHROPIC_AUTH_TOKEN }}
          CODEX_API_KEY: ${{ secrets.LIVE_CODEX_API_KEY }}
        run: poetry run python scripts/ci_qualification_gates.py --live --gate live-external

      - name: Archive sanitized live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-qualification-evidence
          path: workspace/qualification/ci/
          if-no-files-found: warn
