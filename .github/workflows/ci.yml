name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Poetry metadata check
        run: poetry check

      - name: Lockfile check
        run: poetry check --lock

      - name: Ruff
        run: poetry run ruff check --config pyproject.toml src tests --output-format=github

      - name: Mypy
        run: poetry run mypy src --no-error-summary

      - name: Pytest
        env:
          ANTHROPIC_BASE_URL: http://anthropic.invalid
          ANTHROPIC_AUTH_TOKEN: test-token
        run: poetry run pytest tests -q

  distributed:
    # Runs the postgres/distributed-marked tests against a real Postgres
    # service plus the multi-process distributed harness. The default
    # `test` job has no Postgres (those tests skip there); this job is
    # the dedicated gate.
    name: Distributed (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Pytest (postgres + distributed markers)
        env:
          ANTHROPIC_BASE_URL: http://anthropic.invalid
          ANTHROPIC_AUTH_TOKEN: test-token
          AUTORESEARCH_DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: poetry run pytest -m "postgres or distributed" -vv

  ui:
    name: UI Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: ui
        run: npx vite build

      - name: Production ops tests
        working-directory: ui
        run: node scripts/run-production-ops-tests.mjs
